spring.application.name=movies-service
server.port=8082

# environment variable containing MongoDB connection string
# It tells Spring Boot:
# Which MongoDB Atlas cluster to connect to.
# Which database user to authenticate.
# Which database to use.
spring.mongodb.uri=${MONGODB_URI}
# Atlas replica set transactions are required for venue and scheduling writes.
spring.data.mongodb.auto-index-creation=true
omdb.api.key=${OMDB_API_KEY:}
omdb.base-url=${OMDB_BASE_URL:https://www.omdbapi.com}
booking.service.url=${BOOKING_SERVICE_URL:}
spring.jackson.time-zone=UTC
